# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.9.0.schema.json
# Winget installer manifest template (#943, #1156). A zip holding one portable exe: winget unpacks it and puts the folder on PATH.
PackageIdentifier: Gitunia.Gitunia
PackageVersion: @VERSION@
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
- RelativeFilePath: gitunia-@VERSION@-win-x64\gitunia.exe
  PortableCommandAlias: gitunia
ReleaseDate: @DATE@
Installers:
- Architecture: x64
  InstallerUrl: @URL@
  InstallerSha256: @SHA256@
ManifestType: installer
ManifestVersion: 1.9.0
