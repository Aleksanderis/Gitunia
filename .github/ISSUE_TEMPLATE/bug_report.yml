name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Gitunia version
      description: Output of `gitunia --version`.
      placeholder: gitunia 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and terminal
      description: For example Linux (Arch) with kitty, Windows 11 with Windows Terminal.
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: Git version
      description: Output of `git --version`.
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Keys pressed and the state of the repository, as short as you can.
      placeholder: |
        1. Open a repository with ...
        2. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead. A screenshot or pasted terminal text helps. Remove private paths and names.
    validations:
      required: true
