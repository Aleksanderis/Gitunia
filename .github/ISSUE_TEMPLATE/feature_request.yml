name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read the [MVP scope in the README](https://github.com/Aleksanderis/Gitunia/blob/main/README.md#mvp-scope) first.
        Items listed there as out until after MVP (submodules, LFS UI, blame view, hosting-provider integrations, plugins, further themes) are asked about first: describe the need here and wait for an answer before sending code.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Keys, screens or git commands you have in mind.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you do today instead.
    validations:
      required: false
