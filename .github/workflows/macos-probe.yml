name: macos-probe
on:
  push:
    branches: ["fix/1273-macos-runner"]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-latest, macos-15-intel, macos-14-large]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: uname -m && sw_vers
