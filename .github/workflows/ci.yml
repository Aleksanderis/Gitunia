name: CI

# Runs on pull requests, pushes to main, release tags and on demand (`gh workflow run ci.yml`). Re-enabled when the
# repository went public (minutes are free there; supersedes the manual-only decision of 2026-10-18).
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Which leg to run (all = linux-x64 and windows-x64; macOS costs 10x minutes, so only macos runs it; arm64 runs the two arm64 legs; tags run all of them)
        type: choice
        options: [all, linux, windows, macos, arm64]
        default: all

permissions:
  contents: read

# Release packaging (#48): on a v* tag the AOT binaries of both legs are archived by scripts/package.sh and attached to
# a draft GitHub release by the `release` job. The `check` job (#937) looks for a green full dispatch run on the tagged
# commit: if there is one the tag run skips build and tests (#899), else it builds and tests itself. It never waits.
# The macOS leg (#455) runs on tags and when chosen in a dispatch, never as part of `all` (10x minutes); macos-14 is pinned because it is Apple silicon. It always
# builds and tests (the green-run lookup covers Linux and Windows x64 only). The arm64 legs (#1247, linux-arm64 and windows-arm64)
# build on native arm64 runners (AOT cannot cross-compile), run on tags and `platform=arm64` dispatches, never in `all`, and
# always build and test; like macOS, a red arm64 leg does not block the x64 assets.

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    # Tag pushes only (#937): looks up, in seconds, whether a green full run exists for the tagged commit. It never
    # starts a run and never waits on one. Green: the legs only package. Not green: the legs build and test first.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      green: ${{ steps.lookup.outputs.green }}
    steps:
      - name: Look for a green full CI run for the tagged commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Green means a successful `workflow_dispatch` run on this commit whose jobs `linux-x64` and `windows-x64`
          # both succeeded, not skipped (renaming a leg makes this report not green). Any lookup error also reports
          # not green, so the tag run tests instead of trusting an unverified run (fail closed).
          api="repos/$GITHUB_REPOSITORY/actions"
          green=false
          if ids="$(gh api "$api/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=workflow_dispatch&status=success&per_page=100" --jq '.workflow_runs[].id')"; then
            for id in $ids; do
              if ok="$(gh api "$api/runs/$id/jobs" --jq '[.jobs[] | select((.name == "linux-x64" or .name == "windows-x64") and .conclusion == "success")] | length')" && [ "$ok" = "2" ]; then
                echo "Full CI run $id is green for $GITHUB_SHA; the legs only package"; green=true; break
              fi
            done
          else
            echo "::warning::Could not list CI runs; treating as not green"
          fi
          [ "$green" = true ] || echo "No green full CI run for $GITHUB_SHA; this run builds and tests before packaging"
          echo "green=$green" >> "$GITHUB_OUTPUT"

  linux-x64:
    needs: check
    # `check` is skipped off tags; if it failed, `green` is empty and the tag run tests (fail closed).
    if: ${{ !cancelled() && github.event.pull_request.draft != true && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Build (warnings, including IL*, are errors)
        # A tag run with a green full run for the commit only packages (#899, #937); the publish below still builds
        # with warnings as errors. Without one (or off tags) the build and tests run here.
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.check.outputs.green == 'true') }}
        run: dotnet build -c Release
      - name: Test
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.check.outputs.green == 'true') }}
        # A hung run costs 10 minutes, not the job's 15 (#666). The blame hang timeout (one test running longer than
        # 3 minutes) must stay below the step timeout, or the step is cancelled before the report is written; it then
        # names the running test. The step timeout also covers a host that died with no test in flight.
        timeout-minutes: 10
        run: dotnet test -c Release --no-build --blame-hang-timeout 3m --blame-hang-dump-type none
      - name: Decide whether the AOT publish is needed
        id: aot
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Always on schedule/manual runs; on PRs only when projects, props or tooling changed.
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only "$BASE" HEAD)"
          if grep -E '(\.csproj$|\.props$|\.targets$|(^|/)Directory\.|^global\.json$|^dotnet-tools\.json$|^\.github/workflows/)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "AOT publish skipped: no project/dependency files changed"
          fi
      - name: AOT publish (any IL* warning fails)
        if: steps.aot.outputs.run == 'true'
        run: |
          version_arg=""; if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version_arg="-p:Version=${GITHUB_REF_NAME#v}"; fi
          dotnet publish src/Gitunia.Tui -c Release -r linux-x64 -p:TreatWarningsAsErrors=true $version_arg -o out 2>&1 | tee publish.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning IL[0-9]+" publish.log; then echo "::error::trim/AOT warnings found"; exit 1; fi
      - name: Smoke run
        if: steps.aot.outputs.run == 'true'
        run: |
          out="$(./out/gitunia)"
          echo "$out"
          echo "$out" | grep -q "gitunia"
      - name: Smoke run (graph frame of this repository)
        if: steps.aot.outputs.run == 'true'
        run: |
          frame="$(./out/gitunia "$GITHUB_WORKSPACE" --print-frame 100x12)"
          echo "$frame"
          echo "$frame" | grep -q "Gitunia"
          echo "$frame" | grep -q "NORMAL"
      - name: Package (release tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: scripts/package.sh linux-x64 out "${GITHUB_REF_NAME#v}" dist
      - name: Package .deb, .rpm and Arch (release tags only, #942)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          # Pinned nfpm, built from source by the runner's Go (module checksums verified by the Go checksum database).
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          PATH="$(go env GOPATH)/bin:$PATH" scripts/package-linux.sh out "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: dist-linux-x64
          path: dist/*
          if-no-files-found: error

  windows-x64:
    needs: check
    if: ${{ !cancelled() && github.event.pull_request.draft != true && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Faster temp, build output and package cache (#624, unverified for the build)
        # The tests create thousands of throwaway repositories under the temp directory, and a build writes thousands
        # of small files. D: is the runner's faster temporary disk, and Defender scanning every small file is a likely
        # reason a Windows run takes several times as long as the Linux one. The temp directory made Core.Tests about
        # 10x faster (#580); the build output (artifacts layout) and the NuGet cache move there too, not yet measured:
        # compare the Build step time in the next run and drop what does not help. Only these directories are
        # excluded, and a failing exclusion never fails the job.
        shell: pwsh
        run: |
          if (Test-Path D:\) {
            foreach ($directory in "D:\gitunia-tmp", "D:\gitunia-artifacts", "D:\gitunia-nuget") {
              New-Item -ItemType Directory -Force $directory | Out-Null
              try { Add-MpPreference -ExclusionPath $directory -ErrorAction Stop } catch { Write-Warning $_ }
            }
            "TMP=D:\gitunia-tmp" >> $env:GITHUB_ENV
            "TEMP=D:\gitunia-tmp" >> $env:GITHUB_ENV
            "UseArtifactsOutput=true" >> $env:GITHUB_ENV
            "ArtifactsPath=D:\gitunia-artifacts" >> $env:GITHUB_ENV
            "NUGET_PACKAGES=D:\gitunia-nuget" >> $env:GITHUB_ENV
          }
      - name: Build (warnings, including IL*, are errors)
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.check.outputs.green == 'true') }}
        run: dotnet build -c Release
      - name: Test (one project at a time)
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.check.outputs.green == 'true') }}
        # Not yet verified on the runner (#634). `dotnet test` on the solution runs the five assemblies at once, each with 8 xUnit threads, and the tests start
        # thousands of git.exe processes. On the small runner (2-4 vCPU) that made `git init` wait over 30 s (run
        # 39954351890). Sequential projects keep the wall time about the same on a CPU-bound machine but halve the
        # time every git call waits (2 CPUs, local: Git.Tests 6m27 -> 2m43). The loop stops at the first failing
        # project so a broken run does not burn the Tui.Tests minutes, and a hung test host is killed after 10 min.
        # Only OS-sensitive tests run here (#637): classes marked [Trait("Os", "Independent")] are proven by Linux
        # and skipped; an unmarked test still runs, so a forgotten mark costs time, never coverage.
        run: |
          for project in Core Platform Git App Tui; do
            dotnet test "tests/Gitunia.$project.Tests" -c Release --no-build --filter "Os!=Independent" \
              --blame-hang-timeout 10m --blame-hang-dump-type none || exit 1
          done
      - name: AOT publish (any IL* warning fails)
        run: |
          version_arg=""; if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version_arg="-p:Version=${GITHUB_REF_NAME#v}"; fi
          dotnet publish src/Gitunia.Tui -c Release -r win-x64 -p:TreatWarningsAsErrors=true $version_arg -o out 2>&1 | tee publish.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning IL[0-9]+" publish.log; then echo "::error::trim/AOT warnings found"; exit 1; fi
      - name: Smoke run
        run: |
          out="$(./out/gitunia.exe)"
          echo "$out"
          echo "$out" | grep -q "gitunia"
      - name: Smoke run (graph frame of this repository)
        run: |
          frame="$(./out/gitunia.exe "$GITHUB_WORKSPACE" --print-frame 100x12)"
          echo "$frame"
          echo "$frame" | grep -q "Gitunia"
          echo "$frame" | grep -q "NORMAL"
      - name: Package (release tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: scripts/package.sh win-x64 out "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: dist-win-x64
          path: dist/*
          if-no-files-found: error

  macos-arm64:
    # Tags and an explicit `platform: macos` dispatch only (#455): macOS minutes cost 10x on the free plan.
    needs: check
    if: ${{ !cancelled() && (inputs.platform == 'macos' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (warnings, including IL*, are errors)
        run: dotnet build -c Release
      - name: Test (one project at a time)
        # Same shape as the Windows leg: only OS-sensitive tests (#637), projects in sequence, hung host killed. Unlike
        # Windows it runs every project even after a failure (this leg is rarely run, so one run should show all), and
        # scripts/ci-hang-watch.sh prints the process tree and stack samples when no test finishes for 45 s (#959: one
        # run 41260491071 stalled for 10 minutes with every test thread stuck; it did not recur in the 4 Git.Tests runs
        # after it, runs 41285571728 and 41286099525; the watcher stays until it is explained, issue #960).
        run: |
          set -o pipefail
          scripts/ci-hang-watch.sh &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true' EXIT
          status=0
          for project in Core Platform Git App Tui; do
            dotnet test "tests/Gitunia.$project.Tests" -c Release --no-build --filter "Os!=Independent" \
              --logger "console;verbosity=normal" --blame-hang-timeout 3m --blame-hang-dump-type none 2>&1 \
              | tee -a /tmp/test-out.log || status=1
          done
          exit $status
      - name: AOT publish (any IL* warning fails)
        run: |
          version_arg=""; if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version_arg="-p:Version=${GITHUB_REF_NAME#v}"; fi
          dotnet publish src/Gitunia.Tui -c Release -r osx-arm64 -p:TreatWarningsAsErrors=true $version_arg -o out 2>&1 | tee publish.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning IL[0-9]+" publish.log; then echo "::error::trim/AOT warnings found"; exit 1; fi
      - name: Smoke run
        run: |
          out="$(./out/gitunia)"
          echo "$out"
          echo "$out" | grep -q "gitunia"
      - name: Smoke run (graph frame of this repository)
        run: |
          frame="$(./out/gitunia "$GITHUB_WORKSPACE" --print-frame 100x12)"
          echo "$frame"
          echo "$frame" | grep -q "Gitunia"
          echo "$frame" | grep -q "NORMAL"
      - name: Package (release tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: scripts/package.sh osx-arm64 out "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: dist-osx-arm64
          path: dist/*
          if-no-files-found: error

  linux-arm64:
    # Tags and an explicit `platform: arm64` dispatch only (#1247); native arm64 runner, free for public repositories.
    needs: check
    if: ${{ !cancelled() && (inputs.platform == 'arm64' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Build (warnings, including IL*, are errors)
        run: dotnet build -c Release
      - name: Test
        timeout-minutes: 12
        run: dotnet test -c Release --no-build --blame-hang-timeout 3m --blame-hang-dump-type none
      - name: AOT publish (any IL* warning fails)
        run: |
          version_arg=""; if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version_arg="-p:Version=${GITHUB_REF_NAME#v}"; fi
          dotnet publish src/Gitunia.Tui -c Release -r linux-arm64 -p:TreatWarningsAsErrors=true $version_arg -o out 2>&1 | tee publish.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning IL[0-9]+" publish.log; then echo "::error::trim/AOT warnings found"; exit 1; fi
      - name: Smoke run
        run: |
          out="$(./out/gitunia)"
          echo "$out"
          echo "$out" | grep -q "gitunia"
      - name: Smoke run (graph frame of this repository)
        run: |
          frame="$(./out/gitunia "$GITHUB_WORKSPACE" --print-frame 100x12)"
          echo "$frame"
          echo "$frame" | grep -q "Gitunia"
          echo "$frame" | grep -q "NORMAL"
      - name: Package (release tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: scripts/package.sh linux-arm64 out "${GITHUB_REF_NAME#v}" dist
      - name: Package .deb, .rpm and Arch (release tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          PATH="$(go env GOPATH)/bin:$PATH" scripts/package-linux.sh out "${GITHUB_REF_NAME#v}" dist arm64
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: dist-linux-arm64
          path: dist/*
          if-no-files-found: error

  windows-arm64:
    # Tags and an explicit `platform: arm64` dispatch only (#1247); native arm64 runner, free for public repositories.
    needs: check
    if: ${{ !cancelled() && (inputs.platform == 'arm64' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (warnings, including IL*, are errors)
        run: dotnet build -c Release
      - name: Test (one project at a time, OS-sensitive tests only)
        run: |
          for project in Core Platform Git App Tui; do
            dotnet test "tests/Gitunia.$project.Tests" -c Release --no-build --filter "Os!=Independent" \
              --blame-hang-timeout 10m --blame-hang-dump-type none || exit 1
          done
      - name: AOT publish (any IL* warning fails)
        run: |
          version_arg=""; if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version_arg="-p:Version=${GITHUB_REF_NAME#v}"; fi
          dotnet publish src/Gitunia.Tui -c Release -r win-arm64 -p:TreatWarningsAsErrors=true $version_arg -o out 2>&1 | tee publish.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning IL[0-9]+" publish.log; then echo "::error::trim/AOT warnings found"; exit 1; fi
      - name: Smoke run
        run: |
          out="$(./out/gitunia.exe)"
          echo "$out"
          echo "$out" | grep -q "gitunia"
      - name: Smoke run (graph frame of this repository)
        run: |
          frame="$(./out/gitunia.exe "$GITHUB_WORKSPACE" --print-frame 100x12)"
          echo "$frame"
          echo "$frame" | grep -q "Gitunia"
          echo "$frame" | grep -q "NORMAL"
      - name: Package (release tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: scripts/package.sh win-arm64 out "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: dist-win-arm64
          path: dist/*
          if-no-files-found: error

  release:
    # Draft release so the owner reads the notes and publishes it; never runs for dispatch or branches. A red macOS or arm64 leg
    # does not block the x64 assets (#455, #1247).
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.linux-x64.result == 'success' && needs.windows-x64.result == 'success' }}
    needs: [linux-x64, windows-x64, macos-arm64, linux-arm64, windows-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-runs after a partial failure replace the assets of the existing release instead of failing.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "$GITHUB_REF_NAME"
          fi
