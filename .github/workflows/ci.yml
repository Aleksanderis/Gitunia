name: CI

# Runs on pull requests, pushes to main and on demand (`gh workflow run ci.yml`). Re-enabled when the repository went
# public (minutes are free there; supersedes the manual-only decision of 2026-10-18). It does not run on tags: release
# packaging lives in release.yml (#1295), which reuses or dispatches a full run of this workflow for the tagged commit.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Which leg to run (all = linux-x64 and windows-x64; macOS costs 10x minutes, so only macos runs it; arm64 runs the two arm64 legs)
        type: choice
        options: [all, linux, windows, macos, arm64]
        default: all

permissions:
  contents: read

# Legs: linux-x64 and windows-x64 run in `all`. macos-arm64 (#455) runs only when chosen in a dispatch (10x minutes);
# macos-15 is pinned because it is Apple silicon (macos-14 was retired, #1273). The arm64 legs (#1247, linux-arm64 and
# windows-arm64) build on native arm64 runners (AOT cannot cross-compile) and run on `platform=arm64` dispatches, never
# in `all`. release.yml builds and tests those legs itself on a tag. A green full dispatch run (jobs `linux-x64` and
# `windows-x64`, names are matched by release.yml) is what lets a release skip build and test for the x64 legs.

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux-x64:
    if: ${{ github.event.pull_request.draft != true && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Build (warnings, including IL*, are errors)
        run: dotnet build -c Release
      - name: Test
        # A hung run costs 10 minutes, not the job's 15 (#666). The blame hang timeout (one test running longer than
        # 3 minutes) must stay below the step timeout, or the step is cancelled before the report is written; it then
        # names the running test. The step timeout also covers a host that died with no test in flight.
        timeout-minutes: 10
        run: dotnet test -c Release --no-build --blame-hang-timeout 3m --blame-hang-dump-type none
      - name: Install script test (fake release on disk, #1248)
        run: scripts/test-install.sh
      - name: Decide whether the AOT publish is needed
        id: aot
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Always on schedule/manual runs; on PRs only when projects, props or tooling changed.
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only "$BASE" HEAD)"
          if grep -E '(\.csproj$|\.props$|\.targets$|(^|/)Directory\.|^global\.json$|^dotnet-tools\.json$|^\.github/workflows/)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "AOT publish skipped: no project/dependency files changed"
          fi
      - name: AOT publish (any IL* warning fails)
        if: steps.aot.outputs.run == 'true'
        run: |
          dotnet publish src/Gitunia.Tui -c Release -r linux-x64 -p:TreatWarningsAsErrors=true -o out 2>&1 | tee publish.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning IL[0-9]+" publish.log; then echo "::error::trim/AOT warnings found"; exit 1; fi
      - name: Smoke run
        if: steps.aot.outputs.run == 'true'
        run: |
          out="$(./out/gitunia)"
          echo "$out"
          echo "$out" | grep -q "gitunia"
      - name: Smoke run (graph frame of this repository)
        if: steps.aot.outputs.run == 'true'
        run: |
          frame="$(./out/gitunia "$GITHUB_WORKSPACE" --print-frame 100x12)"
          echo "$frame"
          echo "$frame" | grep -q "Gitunia"
          echo "$frame" | grep -q "NORMAL"

  windows-x64:
    if: ${{ github.event.pull_request.draft != true && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Faster temp, build output and package cache (#624, unverified for the build)
        # The tests create thousands of throwaway repositories under the temp directory, and a build writes thousands
        # of small files. D: is the runner's faster temporary disk, and Defender scanning every small file is a likely
        # reason a Windows run takes several times as long as the Linux one. The temp directory made Core.Tests about
        # 10x faster (#580); the build output (artifacts layout) and the NuGet cache move there too, not yet measured:
        # compare the Build step time in the next run and drop what does not help. Only these directories are
        # excluded, and a failing exclusion never fails the job.
        shell: pwsh
        run: |
          if (Test-Path D:\) {
            foreach ($directory in "D:\gitunia-tmp", "D:\gitunia-artifacts", "D:\gitunia-nuget") {
              New-Item -ItemType Directory -Force $directory | Out-Null
              try { Add-MpPreference -ExclusionPath $directory -ErrorAction Stop } catch { Write-Warning $_ }
            }
            "TMP=D:\gitunia-tmp" >> $env:GITHUB_ENV
            "TEMP=D:\gitunia-tmp" >> $env:GITHUB_ENV
            "UseArtifactsOutput=true" >> $env:GITHUB_ENV
            "ArtifactsPath=D:\gitunia-artifacts" >> $env:GITHUB_ENV
            "NUGET_PACKAGES=D:\gitunia-nuget" >> $env:GITHUB_ENV
          }
      - name: Build (warnings, including IL*, are errors)
        run: dotnet build -c Release
      - name: Test (one project at a time)
        # Not yet verified on the runner (#634). `dotnet test` on the solution runs the five assemblies at once, each with 8 xUnit threads, and the tests start
        # thousands of git.exe processes. On the small runner (2-4 vCPU) that made `git init` wait over 30 s (run
        # 39954351890). Sequential projects keep the wall time about the same on a CPU-bound machine but halve the
        # time every git call waits (2 CPUs, local: Git.Tests 6m27 -> 2m43). The loop stops at the first failing
        # project so a broken run does not burn the Tui.Tests minutes, and a hung test host is killed after 10 min.
        # Only OS-sensitive tests run here (#637): classes marked [Trait("Os", "Independent")] are proven by Linux
        # and skipped; an unmarked test still runs, so a forgotten mark costs time, never coverage.
        run: |
          for project in Core Platform Git App Tui; do
            dotnet test "tests/Gitunia.$project.Tests" -c Release --no-build --filter "Os!=Independent" \
              --blame-hang-timeout 10m --blame-hang-dump-type none || exit 1
          done
      - name: Install script test (Windows PowerShell 5.1 and pwsh, fake release on disk, #1248)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-install.ps1
          pwsh -NoProfile -File scripts/test-install.ps1
      - name: AOT publish (any IL* warning fails)
        run: |
          dotnet publish src/Gitunia.Tui -c Release -r win-x64 -p:TreatWarningsAsErrors=true -o out 2>&1 | tee publish.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning IL[0-9]+" publish.log; then echo "::error::trim/AOT warnings found"; exit 1; fi
      - name: Smoke run
        run: |
          out="$(./out/gitunia.exe)"
          echo "$out"
          echo "$out" | grep -q "gitunia"
      - name: Smoke run (graph frame of this repository)
        run: |
          frame="$(./out/gitunia.exe "$GITHUB_WORKSPACE" --print-frame 100x12)"
          echo "$frame"
          echo "$frame" | grep -q "Gitunia"
          echo "$frame" | grep -q "NORMAL"

  macos-arm64:
    # Tags and an explicit `platform: macos` dispatch only (#455): macOS minutes cost 10x on the free plan.
    if: ${{ inputs.platform == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (warnings, including IL*, are errors)
        run: dotnet build -c Release
      - name: Test (one project at a time)
        # Same shape as the Windows leg: only OS-sensitive tests (#637), projects in sequence, hung host killed. Unlike
        # Windows it runs every project even after a failure (this leg is rarely run, so one run should show all), and
        # scripts/ci-hang-watch.sh prints the process tree and stack samples when no test finishes for 45 s (#959: one
        # run 41260491071 stalled for 10 minutes with every test thread stuck; it did not recur in the 4 Git.Tests runs
        # after it, runs 41285571728 and 41286099525; the watcher stays until it is explained, issue #960).
        run: |
          set -o pipefail
          scripts/ci-hang-watch.sh &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true' EXIT
          status=0
          for project in Core Platform Git App Tui; do
            dotnet test "tests/Gitunia.$project.Tests" -c Release --no-build --filter "Os!=Independent" \
              --logger "console;verbosity=normal" --blame-hang-timeout 3m --blame-hang-dump-type none 2>&1 \
              | tee -a /tmp/test-out.log || status=1
          done
          exit $status
      - name: AOT publish (any IL* warning fails)
        run: |
          dotnet publish src/Gitunia.Tui -c Release -r osx-arm64 -p:TreatWarningsAsErrors=true -o out 2>&1 | tee publish.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning IL[0-9]+" publish.log; then echo "::error::trim/AOT warnings found"; exit 1; fi
      - name: Smoke run
        run: |
          out="$(./out/gitunia)"
          echo "$out"
          echo "$out" | grep -q "gitunia"
      - name: Smoke run (graph frame of this repository)
        run: |
          frame="$(./out/gitunia "$GITHUB_WORKSPACE" --print-frame 100x12)"
          echo "$frame"
          echo "$frame" | grep -q "Gitunia"
          echo "$frame" | grep -q "NORMAL"

  linux-arm64:
    # Tags and an explicit `platform: arm64` dispatch only (#1247); native arm64 runner, free for public repositories.
    if: ${{ inputs.platform == 'arm64' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Build (warnings, including IL*, are errors)
        run: dotnet build -c Release
      - name: Test
        timeout-minutes: 12
        run: dotnet test -c Release --no-build --blame-hang-timeout 3m --blame-hang-dump-type none
      - name: AOT publish (any IL* warning fails)
        run: |
          dotnet publish src/Gitunia.Tui -c Release -r linux-arm64 -p:TreatWarningsAsErrors=true -o out 2>&1 | tee publish.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning IL[0-9]+" publish.log; then echo "::error::trim/AOT warnings found"; exit 1; fi
      - name: Smoke run
        run: |
          out="$(./out/gitunia)"
          echo "$out"
          echo "$out" | grep -q "gitunia"
      - name: Smoke run (graph frame of this repository)
        run: |
          frame="$(./out/gitunia "$GITHUB_WORKSPACE" --print-frame 100x12)"
          echo "$frame"
          echo "$frame" | grep -q "Gitunia"
          echo "$frame" | grep -q "NORMAL"

  windows-arm64:
    # Tags and an explicit `platform: arm64` dispatch only (#1247); native arm64 runner, free for public repositories.
    if: ${{ inputs.platform == 'arm64' }}
    runs-on: windows-11-arm
    # No D: temp and NuGet speed-up as in windows-x64 (#624): rarely run, and the arm64 runner may have no D: drive.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (warnings, including IL*, are errors)
        run: dotnet build -c Release
      - name: Test (one project at a time, OS-sensitive tests only)
        run: |
          for project in Core Platform Git App Tui; do
            dotnet test "tests/Gitunia.$project.Tests" -c Release --no-build --filter "Os!=Independent" \
              --blame-hang-timeout 10m --blame-hang-dump-type none || exit 1
          done
      - name: AOT publish (any IL* warning fails)
        run: |
          dotnet publish src/Gitunia.Tui -c Release -r win-arm64 -p:TreatWarningsAsErrors=true -o out 2>&1 | tee publish.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning IL[0-9]+" publish.log; then echo "::error::trim/AOT warnings found"; exit 1; fi
      - name: Smoke run
        run: |
          out="$(./out/gitunia.exe)"
          echo "$out"
          echo "$out" | grep -q "gitunia"
      - name: Smoke run (graph frame of this repository)
        run: |
          frame="$(./out/gitunia.exe "$GITHUB_WORKSPACE" --print-frame 100x12)"
          echo "$frame"
          echo "$frame" | grep -q "Gitunia"
          echo "$frame" | grep -q "NORMAL"
