name: CI

# Minutes are limited on the free plan (decision 2026-10-18): CI never runs on PRs or pushes. Local builds are
# the gate. It runs on release tags and on demand (`gh workflow run ci.yml`).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Which leg to run (tags always run both)
        type: choice
        options: [all, linux, windows]
        default: all

permissions:
  contents: read

# Release packaging (#48): on a v* tag the AOT binaries of both legs are archived by scripts/package.sh and attached to
# a draft GitHub release by the `release` job. Tag runs skip build and tests (#899); the guard job reuses or starts
# (#921) a green full dispatch run on the same commit. macOS and linux-arm64 binaries follow with their CI legs (#455).

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guard:
    # Tag pushes only (#899, #921): reuses a green full run for the tagged commit, else starts and awaits one, so the
    # tests run once per release and a red run fails the release before the packaging legs start.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Covers the awaited full run (Windows leg 25 min plus queueing); only this cheap Linux job waits.
    timeout-minutes: 60
    permissions:
      actions: write
      checks: read # `gh run watch` reads job annotations
    steps:
      - name: Require a green full CI run for the tagged commit, starting one if needed (#921)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag runs only package. The tests run in a `workflow_dispatch` run (platform all) on this commit: green means
          # both legs (job names `linux-x64`, `windows-x64`; renaming one makes this guard fail closed) succeeded, not skipped.
          api="repos/$GITHUB_REPOSITORY/actions"
          runs_for() { gh api "$api/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=workflow_dispatch&per_page=100" --jq "$1"; }
          legs_green() {
            local ok
            ok="$(gh api "$api/runs/$1/jobs" --jq '[.jobs[] | select((.name == "linux-x64" or .name == "windows-x64") and .conclusion == "success")] | length')"
            [ "$ok" = "2" ]
          }
          for id in $(runs_for '.workflow_runs[] | select(.conclusion == "success") | .id'); do
            if legs_green "$id"; then echo "Full CI run $id is green for $GITHUB_SHA; no new run"; exit 0; fi
          done
          # A run already queued or in progress for this commit is awaited instead of starting a second one.
          id="$(runs_for '[.workflow_runs[] | select(.status != "completed")] | first | .id // empty')"
          if [ -z "$id" ]; then
            before="$(runs_for '[.workflow_runs[].id] | sort | join(" ")')"
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f platform=all
            for _ in $(seq 1 24); do
              sleep 5
              for candidate in $(runs_for '.workflow_runs[].id'); do
                case " $before " in *" $candidate "*) ;; *) id="$candidate" ;; esac
              done
              [ -n "$id" ] && break
            done
            [ -n "$id" ] || { echo "::error::Started CI for $GITHUB_SHA but found no new run"; exit 1; }
            echo "Started full CI run $id for $GITHUB_SHA"
          else
            echo "Awaiting full CI run $id already in progress for $GITHUB_SHA"
          fi
          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 \
            || { echo "::error::Full CI run $id is not green for $GITHUB_SHA; fix it, then re-run this release"; exit 1; }
          legs_green "$id" || { echo "::error::Run $id succeeded but its linux-x64 and windows-x64 legs were not both run (platform must be all)"; exit 1; }

  linux-x64:
    needs: guard
    if: ${{ !cancelled() && github.event.pull_request.draft != true && inputs.platform != 'windows' && (needs.guard.result == 'success' || needs.guard.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Build (warnings, including IL*, are errors)
        # Tags only package (#899): the publish below still builds with warnings as errors; build and tests ran in
        # the full dispatch run that the release job requires.
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        run: dotnet build -c Release
      - name: Test
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        # A hung run costs 10 minutes, not the job's 15 (#666). The blame hang timeout (one test running longer than
        # 3 minutes) must stay below the step timeout, or the step is cancelled before the report is written; it then
        # names the running test. The step timeout also covers a host that died with no test in flight.
        timeout-minutes: 10
        run: dotnet test -c Release --no-build --blame-hang-timeout 3m --blame-hang-dump-type none
      - name: Decide whether the AOT publish is needed
        id: aot
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Always on schedule/manual runs; on PRs only when projects, props or tooling changed.
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only "$BASE" HEAD)"
          if grep -E '(\.csproj$|\.props$|\.targets$|(^|/)Directory\.|^global\.json$|^dotnet-tools\.json$|^\.github/workflows/)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "AOT publish skipped: no project/dependency files changed"
          fi
      - name: AOT publish (any IL* warning fails)
        if: steps.aot.outputs.run == 'true'
        run: |
          version_arg=""; if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version_arg="-p:Version=${GITHUB_REF_NAME#v}"; fi
          dotnet publish src/Gitunia.Tui -c Release -r linux-x64 -p:TreatWarningsAsErrors=true $version_arg -o out 2>&1 | tee publish.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning IL[0-9]+" publish.log; then echo "::error::trim/AOT warnings found"; exit 1; fi
      - name: Smoke run
        if: steps.aot.outputs.run == 'true'
        run: |
          out="$(./out/gitunia)"
          echo "$out"
          echo "$out" | grep -q "gitunia"
      - name: Smoke run (graph frame of this repository)
        if: steps.aot.outputs.run == 'true'
        run: |
          frame="$(./out/gitunia "$GITHUB_WORKSPACE" --print-frame 100x12)"
          echo "$frame"
          echo "$frame" | grep -q "Gitunia"
          echo "$frame" | grep -q "NORMAL"
      - name: Package (release tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: scripts/package.sh linux-x64 out "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: dist-linux-x64
          path: dist/*
          if-no-files-found: error

  windows-x64:
    needs: guard
    if: ${{ !cancelled() && inputs.platform != 'linux' && (needs.guard.result == 'success' || needs.guard.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Faster temp, build output and package cache (#624, unverified for the build)
        # The tests create thousands of throwaway repositories under the temp directory, and a build writes thousands
        # of small files. D: is the runner's faster temporary disk, and Defender scanning every small file is a likely
        # reason a Windows run takes several times as long as the Linux one. The temp directory made Core.Tests about
        # 10x faster (#580); the build output (artifacts layout) and the NuGet cache move there too, not yet measured:
        # compare the Build step time in the next run and drop what does not help. Only these directories are
        # excluded, and a failing exclusion never fails the job.
        shell: pwsh
        run: |
          if (Test-Path D:\) {
            foreach ($directory in "D:\gitunia-tmp", "D:\gitunia-artifacts", "D:\gitunia-nuget") {
              New-Item -ItemType Directory -Force $directory | Out-Null
              try { Add-MpPreference -ExclusionPath $directory -ErrorAction Stop } catch { Write-Warning $_ }
            }
            "TMP=D:\gitunia-tmp" >> $env:GITHUB_ENV
            "TEMP=D:\gitunia-tmp" >> $env:GITHUB_ENV
            "UseArtifactsOutput=true" >> $env:GITHUB_ENV
            "ArtifactsPath=D:\gitunia-artifacts" >> $env:GITHUB_ENV
            "NUGET_PACKAGES=D:\gitunia-nuget" >> $env:GITHUB_ENV
          }
      - name: Build (warnings, including IL*, are errors)
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        run: dotnet build -c Release
      - name: Test (one project at a time)
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        # Not yet verified on the runner (#634). `dotnet test` on the solution runs the four assemblies at once, each with 8 xUnit threads, and the tests start
        # thousands of git.exe processes. On the small runner (2-4 vCPU) that made `git init` wait over 30 s (run
        # 39954351890). Sequential projects keep the wall time about the same on a CPU-bound machine but halve the
        # time every git call waits (2 CPUs, local: Git.Tests 6m27 -> 2m43). The loop stops at the first failing
        # project so a broken run does not burn the Tui.Tests minutes, and a hung test host is killed after 10 min.
        # Only OS-sensitive tests run here (#637): classes marked [Trait("Os", "Independent")] are proven by Linux
        # and skipped; an unmarked test still runs, so a forgotten mark costs time, never coverage.
        run: |
          for project in Core Platform Git Tui; do
            dotnet test "tests/Gitunia.$project.Tests" -c Release --no-build --filter "Os!=Independent" \
              --blame-hang-timeout 10m --blame-hang-dump-type none || exit 1
          done
      - name: AOT publish (any IL* warning fails)
        run: |
          version_arg=""; if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version_arg="-p:Version=${GITHUB_REF_NAME#v}"; fi
          dotnet publish src/Gitunia.Tui -c Release -r win-x64 -p:TreatWarningsAsErrors=true $version_arg -o out 2>&1 | tee publish.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning IL[0-9]+" publish.log; then echo "::error::trim/AOT warnings found"; exit 1; fi
      - name: Smoke run
        run: |
          out="$(./out/gitunia.exe)"
          echo "$out"
          echo "$out" | grep -q "gitunia"
      - name: Smoke run (graph frame of this repository)
        run: |
          frame="$(./out/gitunia.exe "$GITHUB_WORKSPACE" --print-frame 100x12)"
          echo "$frame"
          echo "$frame" | grep -q "Gitunia"
          echo "$frame" | grep -q "NORMAL"
      - name: Package (release tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: scripts/package.sh win-x64 out "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: dist-win-x64
          path: dist/*
          if-no-files-found: error

  release:
    # Draft release so the owner reads the notes and publishes it; never runs for dispatch or branches.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x64, windows-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-runs after a partial failure replace the assets of the existing release instead of failing.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "$GITHUB_REF_NAME"
          fi
