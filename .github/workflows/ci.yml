name: CI

# Minutes are limited on the free plan (decision 2026-10-18): CI never runs automatically. Local builds are
# the gate; run this on demand (`gh workflow run ci.yml`), e.g. before closing a milestone or cutting a release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux-x64:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Build (warnings, including IL*, are errors)
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Decide whether the AOT publish is needed
        id: aot
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Always on schedule/manual runs; on PRs only when projects, props or tooling changed.
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only "$BASE" HEAD)"
          if grep -E '(\.csproj$|\.props$|\.targets$|(^|/)Directory\.|^global\.json$|^dotnet-tools\.json$|^\.github/workflows/)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "AOT publish skipped: no project/dependency files changed"
          fi
      - name: AOT publish (any IL* warning fails)
        if: steps.aot.outputs.run == 'true'
        run: |
          dotnet publish src/Gitunia.Tui -c Release -r linux-x64 -p:TreatWarningsAsErrors=true -o out 2>&1 | tee publish.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "warning IL[0-9]+" publish.log; then echo "::error::trim/AOT warnings found"; exit 1; fi
      - name: Smoke run
        if: steps.aot.outputs.run == 'true'
        run: |
          out="$(./out/gitunia)"
          echo "$out"
          echo "$out" | grep -q "gitunia"
      - name: Smoke run (graph frame of this repository)
        if: steps.aot.outputs.run == 'true'
        run: |
          frame="$(./out/gitunia "$GITHUB_WORKSPACE" --print-frame 100x12)"
          echo "$frame"
          echo "$frame" | grep -q "Gitunia"
          echo "$frame" | grep -q "NORMAL"
