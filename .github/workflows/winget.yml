name: winget

# Opens the winget-pkgs PR for a release (#943). Runs only when the owner publishes a release (the draft made by
# ci.yml does not trigger it). The first submission of Gitunia.Gitunia is a manual PR by the owner; this job needs the
# package to exist already. Needs the repo secret WINGET_TOKEN: a classic PAT with public_repo scope (owner creates it).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  submit:
    if: ${{ !github.event.release.prerelease }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate manifests from the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "gitunia-${version}-win-x64.exe.sha256" --dir dl
          scripts/winget-manifest.sh "$version" "dl/gitunia-${version}-win-x64.exe.sha256" manifests "${PUBLISHED_AT%%T*}"
      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) { throw "Repo secret WINGET_TOKEN is not set" }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit manifests
