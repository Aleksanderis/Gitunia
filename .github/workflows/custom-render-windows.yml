name: custom-render-windows

# Not maintained actively: CustomRenderTui is a future option, not the app's renderer (see docs/decisions.md).
# Runs only when its own code changes, or by hand, so it never slows the normal CI.
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/Gitunia.CustomRenderTui/**'
      - 'samples/Gitunia.CustomRenderTui.Demo/**'
      - 'tools/ConPtyHarness/**'
      - 'tools/make-fixture-repo.ps1'
      - '.github/workflows/custom-render-windows.yml'
  pull_request:
    paths:
      - 'src/Gitunia.CustomRenderTui/**'
      - 'samples/Gitunia.CustomRenderTui.Demo/**'
      - 'tools/ConPtyHarness/**'
      - 'tools/make-fixture-repo.ps1'
      - '.github/workflows/custom-render-windows.yml'

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: AOT publish the demo (win-x64)
        run: |
          dotnet publish samples/Gitunia.CustomRenderTui.Demo -c Release -r win-x64 -o out 2>&1 | Tee-Object publish.log
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          if (Select-String -Path publish.log -Pattern 'warning IL') { throw "IL warnings in publish output" }
          "binary bytes: $((Get-Item out/gitunia-custom-demo.exe).Length)"
      - name: Build the ConPTY harness
        run: dotnet build tools/ConPtyHarness -c Release -o harness
      - name: Create fixture repo
        run: ./tools/make-fixture-repo.ps1 -Path $env:RUNNER_TEMP/repo
      - name: Smoke test under ConPTY
        run: dotnet harness/ConPtyHarness.dll out/gitunia-custom-demo.exe $env:RUNNER_TEMP/repo --strict --expect-after-j 2 --expect-after-resize 'j/k gg G' --expect-after-G 40
