# Manual only (CI never runs automatically). Needs Pages source "GitHub Actions", enabled by the owner.
name: pages
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-site.sh site-out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-out
      - id: deployment
        uses: actions/deploy-pages@v4
